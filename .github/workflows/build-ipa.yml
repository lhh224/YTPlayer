name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned YTPlayer.ipa for Sideloadly / AltStore
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Config/APIKeys.plist
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            cat > Config/APIKeys.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>YouTubeAPIKey</key>
              <string>${YOUTUBE_API_KEY}</string>
          </dict>
          </plist>
          EOF
          elif [ ! -f Config/APIKeys.plist ]; then
            cp Config/APIKeys.plist.example Config/APIKeys.plist
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build YTPlayer.app (Release - iphoneos, Unsigned)
        run: |
          xcodebuild build \
            -project YTPlayer.xcodeproj \
            -scheme YTPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package YTPlayer.ipa
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "YTPlayer.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/YTPlayer.app
          cd build
          zip -qry YTPlayer.ipa Payload
          ls -lh YTPlayer.ipa

      - name: Upload YTPlayer.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTPlayer-iOS-IPA
          path: build/YTPlayer.ipa
          if-no-files-found: error
